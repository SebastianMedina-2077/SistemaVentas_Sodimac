<div class="min-vh-100">
  <!-- Barra superior -->
  <header class="bg-white border-bottom sticky-top" style="z-index:20">
    <div class="container-xl d-flex align-items-center gap-3 py-2" style="min-height:68px">
      <a routerLink="/tienda/catalogo" class="d-flex align-items-center">
        <img src="img/sodimac-logo.png" alt="Sodimac" style="height:36px;width:auto" />
      </a>

      <div class="position-relative flex-grow-1" style="max-width:520px">
        <i class="bi bi-search position-absolute text-tenue" style="left:16px;top:11px"></i>
        <input
          type="search"
          class="form-control rounded-pill ps-5"
          style="background:#f5f7fa"
          placeholder="¿Qué estás buscando hoy?"
          (input)="buscar($any($event.target).value)"
          aria-label="Buscar productos"
        />
      </div>

      <div class="ms-auto d-flex align-items-center gap-3">
        <span class="small text-suave d-none d-md-inline">
          Hola, <b class="text-dark">{{ nombreRol() }}</b>
        </span>
        <a
          routerLink="/tienda/checkout"
          class="btn btn-primary rounded-pill d-flex align-items-center gap-2 px-3"
        >
          <i class="bi bi-cart3"></i>
          <span class="d-none d-sm-inline">Carrito</span>
          <span
            class="badge rounded-pill bg-white text-primary font-archivo"
            style="min-width:22px"
            >{{ carrito.unidades('tienda') }}</span
          >
        </a>
        <button type="button" class="btn btn-link sv-enlace text-suave d-inline-flex align-items-center gap-1 px-2"
                style="min-height:44px" (click)="salir()">
          <i class="bi bi-box-arrow-right"></i>
          <span class="d-none d-sm-inline">Salir</span>
        </button>
      </div>
    </div>
  </header>

  <router-outlet />
</div>
