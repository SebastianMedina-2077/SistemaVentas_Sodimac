<div class="d-flex min-vh-100">
  <!-- Sidebar -->
  <aside class="sv-sidebar d-none d-lg-flex">
    <div class="bg-white rounded-3 p-2 px-3 mb-4 mx-1">
      <img src="img/sodimac-logo.png" alt="Sodimac" style="height:34px;width:auto" />
    </div>

    <div class="text-uppercase tracking-wide fw-semibold px-2 mb-2" style="color:#57534e;font-size:.7rem">
      Módulos
    </div>
    <nav class="d-flex flex-column gap-1">
      @for (item of items(); track item.ruta) {
        <a
          class="sv-nav-link"
          [routerLink]="['/admin', item.ruta]"
          routerLinkActive="activo"
        >
          <i class="bi {{ item.icono }}"></i>
          {{ item.nombre }}
        </a>
      }
    </nav>

    <div class="mt-auto border-top pt-3" style="border-color:#292524 !important">
      <div class="small text-tenue px-2 pb-2">Sesión: <b class="text-white">{{ nombreRol() }}</b></div>
      <button type="button" class="sv-nav-link w-100" style="background:#292524" (click)="salir()">
        <i class="bi bi-box-arrow-right"></i> Cerrar sesión
      </button>
    </div>
  </aside>

  <!-- Contenido -->
  <main class="flex-grow-1 d-flex flex-column" style="background:#f5f7fa;min-width:0">
    <header class="bg-white border-bottom d-flex align-items-center justify-content-between px-4 py-3 sticky-top" style="z-index:10">
      <h1 class="font-archivo fw-bold m-0 fs-4" style="letter-spacing:-.01em">{{ titulo() }}</h1>
      <div class="d-flex align-items-center gap-3 small text-suave">
        <span class="d-none d-md-inline">Tienda Homecenter · Lima Norte</span>
        <span class="sv-rol-avatar" style="width:38px;height:38px;background:var(--sv-azul);font-size:.9rem">{{ iniciales() }}</span>
      </div>
    </header>

    <div class="p-4 flex-grow-1">
      <router-outlet />
    </div>
  </main>
</div>
